<path d="M466 440 H510" fill="none" stroke="#9333ea" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M688 440 H732" fill="none" stroke="#db2777" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M909 440 H953" fill="none" stroke="#c2410c" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M1042 298 V260 H158 V296" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="600" y="250" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16" fill="#475569">responses return to each caller</text>
<rect x="70" y="614" width="1060" height="84" rx="8" fill="#fceff5" stroke="#db2777" stroke-width="1.4" stroke-dasharray="7 5"/>
<rect x="70" y="614" width="8" height="84" rx="3" fill="#db2777"/>
<text x="100" y="647" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#db2777">Metrics and benchmarks (planned)</text>
<text x="100" y="676" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" fill="#1f2937">p50/p95/p99 latency, queue depth, batch sizes, throughput. Batching off vs on, fp32 vs int8, load sweeps.</text>
