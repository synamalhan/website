<rect x="70" y="714" width="8" height="84" rx="3" fill="#c2410c"/>
<text x="100" y="747" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#c2410c">Two models, one input</text>
<text x="100" y="776" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" fill="#1f2937">The same preprocessed scan feeds both: the classifier says whether, the segmenter says where.</text>
