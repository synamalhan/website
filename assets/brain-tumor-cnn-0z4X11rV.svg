<text x="100" y="676" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" fill="#1f2937">Accuracy and F1 for classification, Dice and IoU for segmentation.</text>
