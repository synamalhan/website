<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="t"><title id="t">tsbench architecture</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1L10 5L0 9z" fill="#1f2937"/></marker></defs>
<rect width="1200" height="900" fill="#fbfaf7"/>
<rect x="0" y="0" width="201" height="12" fill="#4f46e5"/>
<rect x="200" y="0" width="201" height="12" fill="#9333ea"/>
<rect x="400" y="0" width="201" height="12" fill="#db2777"/>
<rect x="600" y="0" width="201" height="12" fill="#c2410c"/>
<rect x="800" y="0" width="201" height="12" fill="#15803d"/>
<rect x="1000" y="0" width="201" height="12" fill="#0e7490"/>
<text x="70" y="112" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="50" font-weight="800" fill="#1f2937">tsbench</text>
<text x="70" y="156" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="24" fill="#475569">Anomaly-detection benchmark that stress-tests the metrics</text>
<rect x="70" y="184" width="82" height="32" rx="16" fill="#e9e8fb" stroke="#4f46e5" stroke-width="1.4"/><text x="111" y="205" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#4f46e5">Python</text>
<rect x="162" y="184" width="73" height="32" rx="16" fill="#f2e6fc" stroke="#9333ea" stroke-width="1.4"/><text x="198" y="205" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#9333ea">NumPy</text>
<rect x="245" y="184" width="82" height="32" rx="16" fill="#fae5ee" stroke="#db2777" stroke-width="1.4"/><text x="285" y="205" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#db2777">pandas</text>
<rect x="336" y="184" width="133" height="32" rx="16" fill="#f7e8e1" stroke="#c2410c" stroke-width="1.4"/><text x="403" y="205" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#c2410c">scikit-learn</text>
<rect x="479" y="184" width="125" height="32" rx="16" fill="#e2efe7" stroke="#15803d" stroke-width="1.4"/><text x="542" y="205" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#15803d">statsmodels</text>
<rect x="614" y="184" width="82" height="32" rx="16" fill="#e2eef1" stroke="#0e7490" stroke-width="1.4"/><text x="655" y="205" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0e7490">stumpy</text>
<rect x="706" y="184" width="90" height="32" rx="16" fill="#e9e8fb" stroke="#4f46e5" stroke-width="1.4"/><text x="751" y="205" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#4f46e5">PyTorch</text>
<rect x="70" y="300" width="146" height="280" rx="8" fill="#efeefc" stroke="#4f46e5" stroke-width="1.4"/>
<path d="M70 352 V308 a8 8 0 0 1 8 -8 H208 a8 8 0 0 1 8 8 V352 Z" fill="#4f46e5"/>
<text x="143" y="333" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Datasets</text>
<text x="143" y="384" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">NAB and UCR</text>
<text x="143" y="408" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">public sources</text>
<text x="143" y="432" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">labeled anomalies</text>
<text x="143" y="456" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">not included in</text>
<text x="143" y="480" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">the repo</text>
<line x1="84" x2="202" y1="534" y2="534" stroke="#4f46e5" stroke-opacity=".35"/>
<text x="143" y="554" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#4f46e5">→ raw series</text>
<rect x="262" y="300" width="146" height="280" rx="8" fill="#f5ecfd" stroke="#9333ea" stroke-width="1.4"/>
<path d="M262 352 V308 a8 8 0 0 1 8 -8 H400 a8 8 0 0 1 8 8 V352 Z" fill="#9333ea"/>
<text x="335" y="333" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Loader</text>
<text x="335" y="384" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">series + labels</text>
<text x="335" y="408" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">training prefix</text>
<text x="335" y="432" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">split, same for</text>
<text x="335" y="456" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">every detector</text>
<line x1="276" x2="394" y1="534" y2="534" stroke="#9333ea" stroke-opacity=".35"/>
<text x="335" y="554" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#9333ea">→ train and test</text>
<rect x="454" y="300" width="292" height="280" rx="8" fill="#fbebf2" stroke="#db2777" stroke-width="3.2"/>
<path d="M454 352 V308 a8 8 0 0 1 8 -8 H738 a8 8 0 0 1 8 8 V352 Z" fill="#db2777"/>
<text x="600" y="333" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Detectors</text>
<text x="600" y="384" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">z-score, STL residual,</text>
<text x="600" y="408" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">Isolation Forest, LOF,</text>
<text x="600" y="432" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">ARIMA, matrix profile,</text>
<text x="600" y="456" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">autoencoder, plus</text>
<text x="600" y="480" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">random and flag-all</text>
<line x1="468" x2="732" y1="534" y2="534" stroke="#db2777" stroke-opacity=".35"/>
<text x="600" y="554" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#db2777">→ anomaly scores</text>
<rect x="792" y="300" width="146" height="280" rx="8" fill="#f9ede9" stroke="#c2410c" stroke-width="1.4"/>
<path d="M792 352 V308 a8 8 0 0 1 8 -8 H930 a8 8 0 0 1 8 8 V352 Z" fill="#c2410c"/>
<text x="865" y="333" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Metrics</text>
<text x="865" y="384" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">point-wise</text>
<text x="865" y="408" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">point-adjusted</text>
<text x="865" y="432" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">event-based</text>
<text x="865" y="456" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">AUC and detection</text>
<text x="865" y="480" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">delay</text>
<line x1="806" x2="924" y1="534" y2="534" stroke="#c2410c" stroke-opacity=".35"/>
<text x="865" y="554" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#c2410c">→ scores</text>
<rect x="984" y="300" width="146" height="280" rx="8" fill="#e9f3ed" stroke="#15803d" stroke-width="1.4"/>
<path d="M984 352 V308 a8 8 0 0 1 8 -8 H1122 a8 8 0 0 1 8 8 V352 Z" fill="#15803d"/>
<text x="1057" y="333" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#fff">Report</text>
<text x="1057" y="384" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">tables and</text>
<text x="1057" y="408" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">figures from</text>
<text x="1057" y="432" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" fill="#1f2937">one command</text>
<line x1="998" x2="1116" y1="534" y2="534" stroke="#15803d" stroke-opacity=".35"/>
<text x="1057" y="554" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#15803d">→ results</text>
