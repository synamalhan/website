<path d="M938 440 H982" fill="none" stroke="#c2410c" stroke-width="2.4" marker-end="url(#a)"/>
<rect x="70" y="614" width="1060" height="84" rx="8" fill="#fceff5" stroke="#db2777" stroke-width="1.4"/>
<rect x="70" y="614" width="8" height="84" rx="3" fill="#db2777"/>
<text x="100" y="647" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#db2777">Threshold rule</text>
<text x="100" y="676" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" fill="#1f2937">Set from the training prefix only, never from test labels.</text>
<rect x="70" y="714" width="1060" height="84" rx="8" fill="#faf1ed" stroke="#c2410c" stroke-width="1.4" stroke-dasharray="7 5"/>
<rect x="70" y="714" width="8" height="84" rx="3" fill="#c2410c"/>
<text x="100" y="747" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#c2410c">Evaluation (planned)</text>
<text x="100" y="776" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" fill="#1f2937">5 seeds, mean rank with bootstrap CIs, Wilcoxon tests, rank change per metric.</text>
