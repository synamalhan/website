<path d="M393 440 H437" fill="none" stroke="#9333ea" stroke-width="2.4" marker-end="url(#a)"/>
<path d="M577 440 H621" fill="none" stroke="#db2777" stroke-width="2.4" marker-end="url(#a)"/>
