<rect x="253" y="184" width="107" height="32" rx="16" fill="#fae5ee" stroke="#db2777" stroke-width="1.4"/><text x="307" y="205" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#db2777">Streamlit</text>
