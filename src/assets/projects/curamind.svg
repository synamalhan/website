<rect x="571" y="184" width="99" height="32" rx="16" fill="#e2eef1" stroke="#0e7490" stroke-width="1.4"/><text x="620" y="205" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#0e7490">Recharts</text>
