<text x="100" y="776" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="16.5" fill="#1f2937">Compare with Apple Health sleep data or a hand-kept log. Motion is a proxy, not clinical sleep staging.</text>
